# Dependency updates: the same shape in every Where They Stand repository (the charity's family/TOOLCHAIN.md).
# Each Monday Dependabot looks for newer versions and opens a few grouped pull requests, at most three open at a
# time for each kind of dependency. It proposes; nothing is merged without a review and a green CI run.
#
# The Python minor version, the Node major version and the uv version are the family's toolchain. They are set once,
# in family/TOOLCHAIN.md, and changed in every repository in the same week, so they are not Dependabot's to move:
# the Docker section below takes newer releases of Python 3.12 only.
version: 2
updates:
  # Python packages (pyproject.toml and uv.lock). wts-core, the sites' shared package, is named by the address of its
  # release's wheel, which Dependabot doesn't raise: to take a newer release, change the version in pyproject.toml (in
  # both places in the address) and in .github/workflows/ci.yml, and run `uv lock`.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      # Every Python package. This site has no AI, so it has no ai-sensitive group as its sister sites do.
      python:
        patterns:
          - "*"

  # The actions the workflows in .github/workflows/ use
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
    # The family's shared workflows and actions are called at the tag of the shared package this site installs
    # (pyproject.toml), and raised by hand with it, in one change: tests/test_dependencies.py keeps the two the same.
    ignore:
      - dependency-name: "rj-mitchell/wts-core*"

  # The base image in the Dockerfile: newer releases of Python 3.12 only (see the note at the top)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
