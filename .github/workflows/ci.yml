name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The jobs that are the same on every Where They Stand site are the family's shared workflows, in the repository of
# the shared package (wts-core), called at the same tag as the package this site installs (pyproject.toml): one
# number to raise, and CI can't change under the site (wts-core docs/adr/0010). What is this site's own stays here:
# how its pages are built from the publishers' files, and the tests on them.

permissions:
  contents: read

jobs:
  # Lint and the tests that need no data, with the family's toolchain (Python 3.12, uv 0.11.32): uv sync --frozen,
  # ruff check ., pytest. The tests on the real data (tests/test_data.py: the 100 KB page budget, no scripts on
  # landlords' pages, the family binding, reconciliation) skip themselves here; the next job runs them.
  tests:
    uses: rj-mitchell/wts-core/.github/workflows/python.yml@v0.1.0

  # The real pages, built from the publishers' files, then the tests on them and the accessibility check. The files are
  # kept in the Actions cache and fetched again only when config/sources.toml changes, so the publishers' servers are
  # asked once, not on every push (docs/DECISIONS.md: being a good citizen).
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rj-mitchell/wts-core/.github/actions/setup@v0.1.0
      - run: uv sync --frozen --python 3.12
      - name: The publishers' files, from the cache
        id: raw
        uses: actions/cache@v6
        with:
          path: data/raw
          key: raw-${{ hashFiles('config/sources.toml') }}
          restore-keys: raw-
      - name: Fetch new files (only when config/sources.toml has changed)
        if: steps.raw.outputs.cache-hit != 'true'
        run: uv run landlords fetch || echo "::warning::Some sources could not be fetched (see above)"
      - run: uv run landlords load
      - run: uv run landlords build
      - name: Tests on the real data and pages
        run: uv run pytest tests/test_data.py
      - name: Serve the pages
        run: |
          uv run landlords serve --port 8000 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 1; done
      # axe, WCAG 2.2 AA, light and dark, desktop and phone: scripts/a11y.mjs, with Node 22, Playwright and axe at the
      # family's versions
      - name: Accessibility check
        uses: rj-mitchell/wts-core/.github/actions/a11y@v0.1.0
        with:
          url: http://127.0.0.1:8000
      - name: Show the server's log if anything failed
        if: failure()
        run: cat serve.log || true
      # The server was started with `uv run`, which holds uv's cache lock while it runs; stop it, or setup-uv's clean-up
      # at the end of the job waits for that lock and fails the job after five minutes
      - name: Stop the server
        if: always()
        run: pkill -f "landlords serve" || true

  # The server's image must build, and its command must run inside it. The image has no git: the shared package is
  # installed from the wheel of its release (pyproject.toml), which this job proves on every pull request.
  docker:
    uses: rj-mitchell/wts-core/.github/workflows/docker.yml@v0.1.0
    with:
      tag: wherelandlordsstand:ci
      run: landlords --help
