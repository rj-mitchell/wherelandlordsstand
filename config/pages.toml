# The about, terms, accessibility and "not found" pages. Like config/wording.toml, every sentence lives here.
# {contact}, {operator}, {parent}, {site} and {url} are filled from config/settings.toml ([site]).
# [Words](address) in a sentence become a link: an address that doesn't start with https:// or mailto: is a page on this
# site, from its root ("corrections/index.html"). A paragraph that is a list of sentences is shown as a bulleted list.

[about]
heading = "About"
sections = [
  ["What this site is", [
    "Where Landlords Stand helps people decide about a social home. If you see a landlord named on a home you could bid for, or you are offered a home, you can see what that landlord is like in under a minute.",
    "It covers every council and housing association in England with 1,000 or more homes. It uses only what the Regulator of Social Housing and the Housing Ombudsman publish: tenants' answers to the regulator's survey, the landlord's own records, the regulator's grades, and the Ombudsman's findings on complaints.",
  ]],
  ["What it is not", [
    "It is not advice. It never tells anyone to turn down an offer: saying no to an offer can affect your place on the housing register.",
    "It never changes the publishers' figures. Where we work something out, such as how a landlord compares with similar landlords, we say so and explain how on the method page.",
  ]],
  ["Who runs it", [
    "{site} is a Where They Stand project. Where They Stand is applying to register as a charity in England and Wales. Until it is registered, the site is run by its founder, {operator}.",
    "Where Landlords Stand is independent. It is not affiliated with or endorsed by the Regulator of Social Housing, the Housing Ombudsman Service or any landlord. No landlord pays to be on it. It shows no logos: landlords are named, nothing more.",
    "The code is open source, under the GNU Affero General Public License (AGPL-3.0). You can [read the source code](https://github.com/rj-mitchell/wherelandlordsstand).",
  ]],
  ["In the family", [
    "{site} is a Where They Stand project. Its sister sites are [Where MPs Stand](https://wherempsstand.com/), [Where Councils Stand](https://wherecouncilsstand.com/), [Where Countries Stand](https://wherecountriesstand.com/) and [Where Lives Stand](https://wherelivesstand.com/); the charity's own site is [wheretheystand.uk](https://wheretheystand.uk/).",
    [
      "Where MPs Stand shows what MPs and peers have said and done in Parliament.",
      "Where Councils Stand shows what councils have decided and said in their meetings.",
      "Where Countries Stand shows what countries have said and how they have voted at the United Nations.",
      "Where Lives Stand shows how life compares from one country to another, using published figures.",
    ],
    "Each council's page here, and each council area's page, links to that council's page on Where Councils Stand, where that site covers the council. Where Councils Stand links back here.",
  ]],
  ["Contact", [
    "Email [{contact}](mailto:{contact}). To report a mistake, use the form on the [corrections page](corrections/index.html).",
  ]],
]

[terms]
heading = "Terms of use"
short = "The short version: use it freely, check the sources, and credit the site if you reuse its work."
updated = "2026-11-06"
sections = [
  ["About these terms", [
    "{site} is a Where They Stand project. Where They Stand is applying to register as a charity in England and Wales. Until it is registered, the site is run by its founder, {operator}. By using the site you agree to these terms. Contact: [{contact}](mailto:{contact}).",
  ]],
  ["What the service is, and is not", [
    "The site shows figures published by the Regulator of Social Housing and the Housing Ombudsman, and where each landlord comes among similar landlords. Every figure links to the file it comes from. Always check the source before relying on a figure.",
    "It is general information, not legal or housing advice, and not a recommendation to bid for, accept or refuse any home.",
    "Where Landlords Stand is independent. It is not affiliated with or endorsed by the Regulator of Social Housing, the Housing Ombudsman Service or any landlord.",
    "The service is free and provided \"as is\". It may change, be paused or stop.",
  ]],
  ["Reusing our work", [
    "Our own work on the site is licensed under the Creative Commons Attribution 4.0 International licence (CC BY 4.0): the text we write, the bands, the peer groups, the homes by council area, and the method. You may copy, share and adapt it for any purpose, including commercially, as long as you credit {site}, link to the page, and say if you changed it. For example: \"Bands from {site} ({url}), CC BY 4.0.\"",
    "Other material is under its own terms. The regulator's figures are used under the Open Government Licence v3.0. The Housing Ombudsman's figures are © Housing Ombudsman Service, and we are confirming its terms for reuse. The name {site} and its mark are not covered by the CC licence: please don't use them in a way that suggests the site endorses you or your work.",
  ]],
  ["Fair use of the service", [
    "Please don't send automated requests in bulk: everything is in the data downloads. Please don't try to break, overload or gain unauthorised access to the site, or present its figures as saying something they do not. Access may be limited or blocked to protect the service.",
  ]],
  ["Responsibility", [
    "Every effort is made to keep the site accurate and fair, and our mistakes are corrected when found and listed on the corrections page. To the extent the law allows, {parent} is not liable for any loss arising from use of, or reliance on, the site. Nothing in these terms limits liability that cannot be limited by law.",
  ]],
  ["Changes and law", [
    "These terms may be updated; the date above shows when. They are governed by the law of England and Wales, and the courts of England and Wales have jurisdiction, without affecting any rights you have where you live.",
  ]],
]

[accessibility]
heading = "Accessibility"
# Filled in from the latest accessibility test (docs/LAUNCH.md).
tested = "2026-11-06"
tested_how = "Every kind of page (a landlord, a council, a merged landlord, one with no survey results, an area, the lists, compare with three landlords, search with and without results, rights, method, downloads, corrections, privacy, about, terms, this page and \"not found\") was checked with the axe-core automated checker against WCAG 2.2 AA, at phone and desktop sizes, in light and dark modes, with no failures. Keyboard use was checked by script."
sections = [
  ["What you can expect", [
    "{site} should be usable by everyone, including people who use a screen reader, a keyboard, voice control or magnification.",
    "Text can be enlarged to 200% or more without loss of content, and the layout fits small screens without scrolling sideways. Every part of the site can be used with a keyboard alone; a \"Skip to main content\" link is the first stop. Pages follow your device's light or dark setting. Bands are shown in words as well as with shaded boxes, so colour is never the only way to tell them apart.",
    "Landlords' pages, area pages and the rights page work without JavaScript. Search and compare need it; without it, the list of all landlords and each landlord's page give the same information.",
    "The site uses no cookies and needs no account. Its sentences aim for a reading age of about 9.",
  ]],
  ["Standard and testing", [
    "The site aims to meet the Web Content Accessibility Guidelines (WCAG) 2.2 at level AA. It was last tested on {tested}. {tested_how}",
    "Automated checks find only some problems, so testing with people who use assistive technology is still to do. If something does not work for you, please tell us.",
  ]],
  ["Known limitations", [
    "Links to the regulator's and the Ombudsman's files go to sites we do not run; some are spreadsheets, which can be hard to use with a screen reader.",
  ]],
  ["Reporting a problem", [
    "If you find something hard to use, or need information in a different format, email {contact} or use the form on the corrections page. We aim to reply within 10 working days.",
  ]],
]

[press]
heading = "Press"
# {profiles}, {areas}, {today} and the example landlord ({example_name}, {example_url}) are filled in by the build.
sections = [
  ["Contact", [
    "If you are writing about {site}, email [{contact}](mailto:{contact}). We will reply as soon as we can.",
    "To tell us about a mistake on a page, use the form on the [corrections page](corrections/index.html).",
  ]],
  ["Facts in brief", [
    [
      "{site} shows what social landlords in England are like, from what the Regulator of Social Housing and the Housing Ombudsman publish.",
      "It has a page for each of {profiles} councils, housing associations and for-profit landlords with 1,000 or more homes, and a page for each of {areas} council areas.",
      "A landlord's page shows the regulator's grade, how its tenants' answers compare with similar landlords, what the Ombudsman found about complaints, and safety checks.",
      "Every figure links to the published file it comes from. We never change a published figure.",
      "It is free. It has no adverts, sets no cookies and needs no account.",
      "It is in alpha: it is new and still being tested.",
      "It is a Where They Stand project. Where They Stand is applying to register as a charity in England and Wales.",
      "Its code is open source (AGPL-3.0), and our own work on it is under the CC BY 4.0 licence.",
    ],
  ]],
  ["How to cite a landlord's page", [
    "Give the landlord's name, the site's name, the page's address and the day you looked at it. For example:",
    "{example_name}. {site}. {example_url} (seen on {today}).",
    "The figures belong to the publishers: the regulator's are under the Open Government Licence v3.0. The bands and the groups of similar landlords are our own work, under CC BY 4.0: credit {site} and link to the page. The [terms](terms/index.html) say more.",
    "Pages change when new figures come out. The [status page](status/index.html) says when they were last made.",
  ]],
  ["Logo files", [
    "You can use these to show the site in a story about it. Please don't change them, or use them in a way that suggests the site supports you or your work.",
    [
      "[The site's mark, a front door open on a lit hall (SVG)](press/mark.svg), and [for dark backgrounds](press/mark-dark.svg)",
      "[The mark simplified for 16 to 32 pixels (SVG)](press/mark-small.svg), and [for dark backgrounds](press/mark-small-dark.svg)",
      "[Its icon, the mark as a browser tab shows it (SVG)](press/where-landlords-stand-icon.svg), and [as a picture, 512 by 512 pixels (PNG)](press/where-landlords-stand-icon-512.png)",
      "[Its link card, 1200 by 630 pixels (PNG)](press/where-landlords-stand-card.png)",
    ],
  ]],
  ["Independence", [
    "Where Landlords Stand is independent. It is not affiliated with or endorsed by the Regulator of Social Housing, the Housing Ombudsman Service or any landlord.",
  ]],
]

[status]
heading = "Site status"
intro = [
  "This page shows how up to date the site is. Every Thursday the site looks for new files from the regulator and the Housing Ombudsman. This page is made again each time.",
]
now_heading = "The pages"
# {date} is filled in as "6 November 2026".
built = "These pages were made on {date}."
checked = "The site last looked for new files on {date}."
not_checked = "The site has not looked for new files yet."
check_failed = "Last time, the site could not look for new files from: {sources}. We are looking into it."
waiting = "New pages, made on {date}, are waiting to be checked by a person before they go live."
not_waiting = "No new pages are waiting to be checked."
sources_heading = "Where the figures come from"
sources_intro = "For each set of files: the newest file in these pages, when we downloaded it, and when we read it into the site."
columns = ["Files", "Newest file", "Downloaded", "Read in"]
never = "not yet"
notes = [
  "New pages never go live on their own: a person checks them first. Until then, the site keeps the pages it has.",
]

# The sets of files, in the order shown, by their folder in config/sources.toml.
[status.sources]
tsm = "Tenant Satisfaction Measures"
judgements = "Grades and other judgements"
providers = "List of social landlords"
stock = "Homes each landlord owns"
ombudsman = "Housing Ombudsman's figures"

[not_found]
heading = "Page not found"
text = "We couldn't find that page. It may have moved. Try searching for the landlord."
