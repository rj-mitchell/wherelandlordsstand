# The about, terms, accessibility, press, status, "If you're named" and "not found" pages. Like config/wording.toml,
# every sentence lives here.
# {contact}, {operator}, {parent}, {site} and {url} are filled from config/settings.toml ([site]).
# [Words](address) in a sentence become a link: an address that doesn't start with https:// or mailto: is a page on this
# site, from its root ("corrections/index.html"). A paragraph that is a list of sentences is shown as a bulleted list.

[about]
heading = "About"
sections = [
  ["What this site is", [
    "Where Landlords Stand helps people decide about a social home. If you see a landlord named on a home you could bid for, or you are offered a home, you can see what that landlord is like in under a minute.",
    "It covers every council and housing association in England with 1,000 or more homes. It uses only what the Regulator of Social Housing and the Housing Ombudsman publish: tenants' answers to the regulator's survey, the landlord's own records, the regulator's grades, and the Ombudsman's findings on complaints.",
  ]],
  ["What it is not", [
    "It is not advice. It never tells anyone to turn down an offer: saying no to an offer can affect your place on the housing register.",
    "It never changes the publishers' figures. Where we work something out, such as how a landlord compares with similar landlords, we say so and explain how on the method page.",
  ]],
  ["Who runs it", [
    "{site} is a Where They Stand project. Where They Stand is applying to register as a charity in England and Wales. Until it is registered, the site is run by its founder, {operator}.",
    "Where Landlords Stand is independent. It is not affiliated with or endorsed by the Regulator of Social Housing, the Housing Ombudsman Service or any landlord. No landlord pays to be on it. It shows no logos: landlords are named, nothing more.",
    "The code is open source, under the GNU Affero General Public License (AGPL-3.0). You can [read the source code](https://github.com/rj-mitchell/wherelandlordsstand).",
  ]],
  ["In the family", [
    "{site} is a Where They Stand project. Its sister sites are [Where MPs Stand](https://wherempsstand.com/), [Where Councils Stand](https://wherecouncilsstand.com/), [Where Countries Stand](https://wherecountriesstand.com/) and [Where Lives Stand](https://wherelivesstand.com/); the charity's own site is [wheretheystand.uk](https://wheretheystand.uk/).",
    [
      "Where MPs Stand shows what MPs and peers have said and done in Parliament.",
      "Where Councils Stand shows what councils have decided and said in their meetings.",
      "Where Countries Stand shows what countries have said and how they have voted at the United Nations.",
      "Where Lives Stand shows how life compares from one country to another, using published figures.",
    ],
    "Each council's page here, and each council area's page, links to that council's page on Where Councils Stand, where that site covers the council. Where Councils Stand links back here.",
  ]],
  ["Contact", [
    "Email [{contact}](mailto:{contact}). To report a mistake, use the form on the [corrections page](corrections/index.html).",
  ]],
]

[terms]
heading = "Terms of use"
short = "The short version: use it freely, check the sources, and credit the site if you reuse its work."
updated = "2026-11-06"
sections = [
  ["About these terms", [
    "{site} is a Where They Stand project. Where They Stand is applying to register as a charity in England and Wales. Until it is registered, the site is run by its founder, {operator}. By using the site you agree to these terms. Contact: [{contact}](mailto:{contact}).",
  ]],
  ["What the service is, and is not", [
    "The site shows figures published by the Regulator of Social Housing and the Housing Ombudsman, and where each landlord comes among similar landlords. Every figure links to the file it comes from. Always check the source before relying on a figure.",
    "It is general information, not legal or housing advice, and not a recommendation to bid for, accept or refuse any home.",
    "Where Landlords Stand is independent. It is not affiliated with or endorsed by the Regulator of Social Housing, the Housing Ombudsman Service or any landlord.",
    "The service is free and provided \"as is\". It may change, be paused or stop.",
  ]],
  ["Reusing our work", [
    "Our own work on the site is licensed under the Creative Commons Attribution 4.0 International licence (CC BY 4.0): the text we write, the bands, the peer groups, the homes by council area, and the method. You may copy, share and adapt it for any purpose, including commercially, as long as you credit {site}, link to the page, and say if you changed it. For example: \"Bands from {site} ({url}), CC BY 4.0.\"",
    "Other material is under its own terms. The regulator's figures are used under the Open Government Licence v3.0. The Housing Ombudsman's figures are © Housing Ombudsman Service, and we are confirming its terms for reuse. The name {site} and its mark are not covered by the CC licence: please don't use them in a way that suggests the site endorses you or your work.",
  ]],
  ["Fair use of the service", [
    "Please don't send automated requests in bulk: everything is in the data downloads. Please don't try to break, overload or gain unauthorised access to the site, or present its figures as saying something they do not. Access may be limited or blocked to protect the service.",
  ]],
  ["Responsibility", [
    "Every effort is made to keep the site accurate and fair, and our mistakes are corrected when found and listed on the corrections page. To the extent the law allows, {parent} is not liable for any loss arising from use of, or reliance on, the site. Nothing in these terms limits liability that cannot be limited by law.",
  ]],
  ["Changes and law", [
    "These terms may be updated; the date above shows when. They are governed by the law of England and Wales, and the courts of England and Wales have jurisdiction, without affecting any rights you have where you live.",
  ]],
]

[accessibility]
heading = "Accessibility"
# Filled in from the latest accessibility test (docs/LAUNCH.md).
tested = "2026-11-12"
tested_how = "Every kind of page (a landlord, a council, a merged landlord, one with no survey results, an area, the lists, compare with three landlords, search with and without results, rights, method, downloads, corrections, \"If you're named\" with its form, a landlord's page and an area's page with a statement from the landlord, privacy, about, terms, this page and \"not found\") was checked with the axe-core automated checker against WCAG 2.2 AA, at phone and desktop sizes, in light and dark modes, with no failures. Keyboard use was checked by script."
sections = [
  ["What you can expect", [
    "{site} should be usable by everyone, including people who use a screen reader, a keyboard, voice control or magnification.",
    "Text can be enlarged to 200% or more without loss of content, and the layout fits small screens without scrolling sideways. Every part of the site can be used with a keyboard alone; a \"Skip to main content\" link is the first stop. Pages follow your device's light or dark setting. Bands are shown in words as well as with shaded boxes, so colour is never the only way to tell them apart.",
    "Landlords' pages, area pages and the rights page work without JavaScript. Search and compare need it; without it, the list of all landlords and each landlord's page give the same information.",
    "The site uses no cookies and needs no account. Its sentences aim for a reading age of about 9.",
  ]],
  ["Standard and testing", [
    "The site aims to meet the Web Content Accessibility Guidelines (WCAG) 2.2 at level AA. It was last tested on {tested}. {tested_how}",
    "Automated checks find only some problems, so testing with people who use assistive technology is still to do. If something does not work for you, please tell us.",
  ]],
  ["Known limitations", [
    "Links to the regulator's and the Ombudsman's files go to sites we do not run; some are spreadsheets, which can be hard to use with a screen reader.",
  ]],
  ["Reporting a problem", [
    "If you find something hard to use, or need information in a different format, email {contact} or use the form on the corrections page. We aim to reply within 10 working days.",
  ]],
]

[named]
# "If you're named" (src/landlords/site_pages.py, named_html; docs/DECISIONS.md, 15): the charity's impartiality policy,
# section 7, in plain words for the landlords this site names. Its heading, the three routes, the statement's heading
# and the response times are the family glossary's words ("Corrections and the right of reply"). Each section has an
# id (its address on the page) and paragraphs; "@example" is a statement drawn as the site shows one, and "@form" the
# statement form. A route is [heading, text, the link's words, its address].
heading = "If you're named"
description = "For landlords this site names: how to put something right, or add a statement in your own words."
contents = "On this page"
intro = [
  "This page is for councils, housing associations and for-profit landlords that this site names, and for people acting for them. It explains how to put something right, or how to add a statement in your own words beside what we say.",
]
[named.example]
name = "[your name]"
date = "[the date it is published]"
role = "[Your role, and the landlord you speak for]"
text = "[Your words, up to 150 words, exactly as you send them.]"

[[named.section]]
id = "who"
heading = "Who this is for"
text = [
  "Every landlord this site covers: councils, housing associations and for-profit landlords in England with 1,000 or more homes, and the companies in their groups. Someone acting for a landlord can use it too: a member of its staff or board, or a council officer or councillor speaking for a council as a landlord.",
  "Everyone else, including tenants and people looking for a home, is welcome to tell us about a mistake on the [corrections page](corrections/index.html).",
  "If your own name or details are on this site and you don't speak for a landlord, [ask us to remove them](corrections/index.html?kind=takedown). We deal with these first. The [privacy page](privacy/index.html) says more.",
]

[[named.section]]
id = "routes"
heading = "Three ways to raise a concern"
routes = [
  ["Something is wrong", "A figure, a name, a date, a label or a connection is wrong. For example, a grade shown for the wrong landlord, a name matched to the wrong landlord, a company counted in the wrong group, a merger we missed, or homes listed in the wrong council area. We put it right as soon as we can, and say what changed and when in the [list of fixes](corrections/index.html#log).", "Report something wrong", "corrections/index.html?kind=wrong"],
  ["You've been characterised unfairly", "The figures are right, but our own words, labels or groupings aren't fair. For example, a sentence in our own voice that takes sides, or a group of similar landlords that suggests something the figures don't show. We check it against the charity's [impartiality policy](https://wheretheystand.uk/right-of-reply) and, if it breaks it, put it right in the same way.", "Report unfair treatment", "corrections/index.html?kind=unfair"],
  ["Add a statement in your own words", "The figures are right and we have followed the policy, but you see it differently. You can add a short statement beside what we say about you. It is shown as you wrote it, marked as yours.", "Write a statement", "named/index.html#send"],
]

[[named.section]]
id = "covered"
heading = "What is covered"
text = [
  "Everything this site says about a landlord, not only its figures. On Where Landlords Stand, that includes:",
  [
    "the regulator's grade as we show it, including a grade we show for a landlord because it was given to its group;",
    "the bands we work out (top quarter, upper middle, lower middle and bottom quarter), and the arrows that show a change since last year;",
    "which similar landlords each landlord is compared with, and what we say about how its tenants were asked;",
    "how we show the Housing Ombudsman's findings and the safety checks (\"all done\", or each check that isn't);",
    "how we match a landlord's names (short, trading, former and advert names), which companies we count as part of a group, and what we say when landlords merge or one reports for another;",
    "the homes we list for each landlord in each council area, and the area pages;",
    "the type we give each landlord (council, housing association or for-profit landlord), and the compare page.",
  ],
  "The figures themselves are not ours. They belong to the Regulator of Social Housing and the Housing Ombudsman, and only they can change them. We can still fix how we read or show them.",
]

[[named.section]]
id = "statements"
heading = "Add a statement in your own words"
parts = [
  ["What it can say", [
    "Up to 150 words, in your own name, about the thing it sits beside: your landlord's page, a part of it (the grade, the bands, the Ombudsman's figures or the safety checks), or a council area's page that lists your landlord. Where you can, point to the record with a link: a statement you have published, a report to your board, or the regulator's or the Ombudsman's own page.",
  ]],
  ["What it can't contain", [
    [
      "anything defamatory or abusive, or about a private individual;",
      "personal information about anyone else, including tenants;",
      "appeals for votes, money or support;",
      "anything about another person's conduct.",
    ],
    "During an election, statements are still accepted, but not ones that campaign.",
  ]],
  ["How it is shown", [
    "Beside the thing it is about, and on your landlord's own page, set apart from our own words, like this:",
    "@example",
    "We publish a statement as you wrote it, or decline it and say why. We never edit it, except to take out something these rules don't allow, and only with your agreement.",
    "A statement is never treated as part of the published figures. It doesn't change a grade or a band, and it isn't in the search, the compare page or the data downloads.",
  ]],
  ["How we check it's you", [
    "Before a statement is shown, we write to the email address you give and check that it belongs to your landlord: usually an address at your landlord's own web address, or your council's. If you write from another address, we check with your landlord through the contact details it publishes.",
  ]],
  ["Changing or withdrawing it", [
    "You can update or withdraw your statement at any time: email [{contact}](mailto:{contact}) from the address you gave. We can remove a statement that breaks these rules, and will tell you why.",
    "@form",
  ]],
]

[[named.section]]
id = "times"
heading = "How long it takes"
text = [
  "We reply within 5 working days, and decide within 20 working days.",
  "Anything that may be unlawful or harmful is dealt with sooner, and requests to remove a person's details come first. Where a concern looks right but will take time to decide, we can hide the item meanwhile, with a note saying so.",
  "Once we decide to publish a statement, it is on the site within a few minutes. A correction goes on the site with the next pages we make, which a person checks before they go live: usually within a week.",
]

[[named.section]]
id = "decides"
heading = "Who decides, and how to appeal"
text = [
  "The charity's founder decides, until the trustees appoint someone else. Every decision and its reasons are logged, and the trustees review the log at each of their meetings.",
  "If you are unhappy with a decision, you can ask for a review (by the trustees, once they are appointed): email [admin@wheretheystand.uk](mailto:admin@wheretheystand.uk). Once the charity is registered, if you are still unhappy, you can also raise your concerns about it with the [Charity Commission](https://www.gov.uk/complain-about-charity).",
  "Letters claiming legal liability, such as defamation, go straight to the trustees. Disputed material may be taken down while they take advice.",
]

[[named.section]]
id = "information"
heading = "Your information"
text = [
  "A statement is published with your name and role, as you wrote them. The email address you give is used only to confirm who you are, and to let you update or withdraw your statement. It is never shown. We keep it while the statement is shown, and delete it three months after the statement is withdrawn or declined. The [privacy page](privacy/index.html) says more.",
]

