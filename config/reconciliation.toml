# Figures the publishers print, which the loaded data must reproduce (`landlords check`).
# Each comes from a named page or report. `tolerance` allows for rounding in published per-landlord figures.
# A `known_difference` is reported but does not fail the check; it must say what was found and where it is written up.

[tsm."2024/25"]
source = "TSM 2024/25 Headline Report and data quality note (Regulator of Social Housing, 4 November 2025)"
submissions = 360                 # landlords with results (the coverage table lists 363; 3 have none)
rented_only = 299                 # includes Cannock Chase and Stoke-on-Trent, whose perception results were excluded
rented_and_shared_ownership = 56
shared_ownership_only = 3
combined = 2
tp01_rented_lower_quartile = 64.7
tp01_rented_median = 71.8
tp01_rented_upper_quartile = 78.9
tolerance = 0.15

[tsm."2024/25".by_method]
# Headline Report, Table 2: surveys collected and overall satisfaction (TP01) by collection method, all submissions.
postal = [40514, 80.2]
"face to face" = [57409, 78.9]
telephone = [313104, 69.4]
sms = [7287, 63.2]
internet = [80505, 60.1]

[tsm."2024/25".telephone_main_method]
# Headline Report, paragraph 2.5 and Figure 4: "71% of landlords used telephone surveys as their principal survey
# collection method."
percent = 71
known_difference = "The data gives 245 of 358 landlords (68.4%) with telephone as the predominant method in any perception table; the other bands in Figure 4 are within about a point. Not yet explained; see docs/DATA.md."

[tsm."2024/25".excluded]
# The data quality note's list of excluded results. Each must appear as [E] (or be absent) in the data.
"00GL" = ["perception"]
"41UB" = ["perception"]
"LH0279" = ["TP09"]
"L4203" = ["TP10"]
"43UK" = ["management"]
"00AE" = ["BS02", "BS03", "BS04", "BS05"]
"45UB" = ["RP02_1"]
"29UC" = ["RP01"]
"L0717" = ["RP02_1", "RP02_2"]
"00AU" = ["CH02_1"]

[tsm."2025/26"]
source = "TSM 2025/26 Headline Report and data quality note (Regulator of Social Housing, 5 November 2026)"
submissions = 356
rented_only = 294
rented_and_shared_ownership = 55
shared_ownership_only = 5
combined = 2
tp01_rented_lower_quartile = 68     # paragraph 16 gives whole percentages; the median is 74.2 in the summary table
tp01_rented_median = 74.2
tp01_rented_upper_quartile = 80
tolerance = 0.5

[tsm."2025/26".by_method]
# Headline Report 2025/26, Table 2: for rented homes (LCRA) only this year, as the share of surveys collected by each
# method and the average satisfaction (TP01) across them.
kind = "share"
stock = "LCRA"
tolerance = 0.15
telephone = [65, 73.0]
internet = [16, 64.5]
"face to face" = [10, 80.7]
postal = [8, 84.5]
sms = [1, 70.0]

[tsm."2025/26".telephone_main_method]
# Figure 18 gives 73.5%; paragraph 71 says both "74% of landlords used telephone surveys as their principal survey
# collection method" and "73% in 2025/26": the report disagrees with itself, so Figure 18 is the figure checked.
percent = 73.5
known_difference = "The data gives 258 of 356 landlords (72.5%) with telephone as the predominant method; Figure 18 gives 73.5% and the text 73% and 74%. The other bands of Figure 18 are within about a point. As in 2024/25, not yet explained; see docs/DATA.md."

[tsm."2025/26".excluded]
# The data quality note 2025/26 ("In 2025/26 the following providers' data has been excluded"). Rugby's TP03 was not
# part of its survey.
"24UF" = ["RP01"]
"00EM" = ["RP01"]
"00AW" = ["RP01"]
"L4499" = ["RP02_1", "RP02_2"]
"00BM" = ["RP02_1", "RP02_2"]
"44UD" = ["TP03"]

[tsm."2023/24"]
source = "TSM 2023/24 Headline Report (Regulator of Social Housing, October 2024), which describes v1.0 of the data; the file loaded is v2.1 (December 2025), which includes resubmissions"
submissions = 360
rented_only = 302
rented_and_shared_ownership = 54
shared_ownership_only = 2
combined = 2
tp01_rented_lower_quartile = 64     # the report gives whole percentages
tp01_rented_median = 71
tp01_rented_upper_quartile = 78
tolerance = 0.5

[tsm."2023/24".by_method]
# Headline Report 2023/24, Table 2: surveys collected by method. Satisfaction by method is not in the 2023/24 data
# file, so only the counts can be checked.
postal = [50622, 77.2]
"face to face" = [28395, 74.7]
telephone = [299190, 69.8]
sms = [10756, 63.1]
internet = [90618, 58.3]

[tsm."2023/24".excluded]
"5125" = ["perception"]
"22UE" = ["perception", "management"]
"43UD" = ["perception", "management"]
"L0717" = ["management"]
"5130" = ["management"]

[ombudsman."2024-25"]
source = "Housing Ombudsman, tables for landlords with individual performance reports 2024-25, Notes sheet"
reports = 281                     # "There are 281 landlords with performance reports"; those with one determination are withheld, number not stated

[ombudsman."2025-26"]
