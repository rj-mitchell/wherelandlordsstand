# Where Landlords Stand settings. Paths are relative to the repository root unless absolute.
# Environment overrides: LANDLORDS_DATA_DIR, LANDLORDS_CONFIG.

[paths]
data_dir = "data"

[fetch]
# Identifies the fetcher to publishers' servers (docs/DECISIONS.md: being a good citizen).
user_agent = "Mozilla/5.0 (compatible; WhereLandlordsStand/0.1; +https://github.com/rj-mitchell/wherelandlordsstand)"
# One request at a time, at least this many seconds apart, to any server.
min_interval_seconds = 1.0
timeout_seconds = 60
retries = 3

[coverage]
# Landlords with at least this many homes get a profile (proposed decision 3).
min_homes = 1000

[site]
name = "Where Landlords Stand"
# Not deployed: the address is set when the owner decides to launch.
url = ""
parent_name = "Where They Stand"
parent_url = "https://wheretheystand.uk"

[sister_sites]
# Council landlords link to their page on Where Councils Stand where it covers the council (docs/DECISIONS.md, 4):
# councils whose Modern.gov service answered (modgov_status "ok" in data_static/councils.csv).
where_councils_stand = "https://wherecouncilsstand.com/councils/{gss}"
# Where Councils Stand still files Barnsley and Sheffield under their pre-2019 codes (docs/DATA.md, "Area codes").
# Remove these once it is fixed there.
where_councils_stand_codes = { E08000038 = "E08000016", E08000039 = "E08000019" }
