# Where Landlords Stand settings. Paths are relative to the repository root unless absolute.
# Environment overrides: LANDLORDS_DATA_DIR, LANDLORDS_CONFIG.

[paths]
data_dir = "data"

[fetch]
# Identifies the fetcher to publishers' servers (docs/DECISIONS.md: being a good citizen).
user_agent = "Mozilla/5.0 (compatible; WhereLandlordsStand/0.1; +https://github.com/rj-mitchell/wherelandlordsstand)"
# One request at a time, at least this many seconds apart, to any server.
min_interval_seconds = 1.0
timeout_seconds = 60
retries = 3

[coverage]
# Landlords with at least this many homes get a profile (proposed decision 3).
min_homes = 1000

[site]
name = "Where Landlords Stand"
# The launch switch (docs/LAUNCH.md). While false, every page asks search engines not to index it (noindex),
# robots.txt asks crawlers to stay away, and new pages are published without asking for approval by email. Set `url` (the domain, with https://) first: the
# sitemap needs it.
launched = false
url = ""
operator = "Rob Mitchell"
contact = "admin@wherelandlordsstand.com"
# The alpha banner on every page, with where to send feedback. Remove `stage` (or set it to "") to take it down.
stage = "alpha"
feedback_email = "admin@wherelandlordsstand.com"
parent_name = "Where They Stand"
parent_url = "https://wheretheystand.uk"

[sister_sites]
# Council landlords link to their page on Where Councils Stand where it covers the council (docs/DECISIONS.md, 4):
# councils whose Modern.gov service answered (modgov_status "ok" in data_static/councils.csv).
where_councils_stand = "https://wherecouncilsstand.com/councils/{gss}"

[publish]
# What the weekly update (`landlords update`) does with new pages (docs/OPERATIONS.md):
#   "approve": before launch, publish them (nothing is public); after launch, email a link to approve them
#   "auto":    publish them whenever their checks pass, and email what changed
mode = "approve"
# Who gets the weekly email. The account that sends it is set on the server, in deploy/.env (src/landlords/notify.py).
notify_to = "wheretheystanduk@gmail.com"
# How long an approval link works, and how many builds are kept.
approval_days = 14
keep_builds = 6
