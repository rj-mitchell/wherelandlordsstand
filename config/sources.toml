# Where each published file is found. `landlords fetch` reads this file (src/landlords/fetch.py).
#
# One [[file]] per kind of file and period. `source` is the folder under data/raw/; `role` says what the file is;
# `period` is the period it covers, written as the publisher writes it. Find files on a GOV.UK page by attachment
# title (`govuk` + `match`), on another page by link address (`page` + `links`), or give `urls` in full.
# `types` limits the file types kept. `keep_page` keeps the page itself, where the data is in the page.
#
# Licences are as stated by each publisher. See docs/DATA.md.

# Tenant Satisfaction Measures -----------------------------------------------------------------------------------

[[file]]
source = "tsm"
role = "full-data"
period = "2024/25"
publisher = "Regulator of Social Housing"
licence = "Open Government Licence v3.0"
govuk = "/government/statistics/tenant-satisfaction-measures-202425"
match = "full data set"
types = ["xlsx", "zip"]

[[file]]
source = "tsm"
role = "report"
period = "2024/25"
publisher = "Regulator of Social Housing"
licence = "Open Government Licence v3.0"
govuk = "/government/statistics/tenant-satisfaction-measures-202425"
match = "headline report|data quality"
types = ["pdf"]
notes = "The headline figures the loaded data is reconciled to, and the list of results the regulator excluded."

[[file]]
source = "tsm"
role = "full-data"
period = "2023/24"
publisher = "Regulator of Social Housing"
licence = "Open Government Licence v3.0"
govuk = "/government/statistics/data-release-tsm-2024"
match = "full data release"
types = ["xlsx"]
notes = "Published only as xlsx. Its Data Dictionary sheet maps each column heading to the field name the 2024/25 CSVs use."

[[file]]
source = "tsm"
role = "report"
period = "2023/24"
publisher = "Regulator of Social Housing"
licence = "Open Government Licence v3.0"
govuk = "/government/statistics/tenant-satisfaction-measures-202324"
match = "tenant satisfaction measures 2023/24"
types = ["pdf"]

# Regulatory judgements and gradings --------------------------------------------------------------------------------

[[file]]
source = "judgements"
role = "table"
period = "current"
publisher = "Regulator of Social Housing"
licence = "Open Government Licence v3.0"
govuk = "/government/publications/regulatory-judgements-and-enforcement-notices"
match = "table"
types = ["xlsx"]
notes = "Published judgements and notices since April 2024, replaced as new ones are published."

[[file]]
source = "judgements"
role = "archive"
period = "2012 to March 2024"
publisher = "Regulator of Social Housing"
licence = "Open Government Licence v3.0"
govuk = "/government/publications/archived-regulatory-judgements-and-notices-table"
match = "archived"
types = ["xlsx"]

[[file]]
source = "judgements"
role = "under-review"
period = "current"
publisher = "Regulator of Social Housing"
licence = "Open Government Licence v3.0"
govuk = "/guidance/gradings-under-review-list"
keep_page = true
notes = "The list is the page itself: kept as the Content API's JSON."

# The register of providers ---------------------------------------------------------------------------------------

