# Where each published file is found. `landlords fetch` reads this file (src/landlords/fetch.py).
#
# One [[file]] per kind of file and period. `source` is the folder under data/raw/; `role` says what the file is;
# `period` is the period it covers, written as the publisher writes it. Find files on a GOV.UK page by attachment
# title (`govuk` + `match`), on another page by link address (`page` + `links`), or give `urls` in full.
# `types` limits the file types kept. `keep_page` keeps the page itself, where the data is in the page.
#
# Licences are as stated by each publisher. See docs/DATA.md.

# Documents in the watched collections (end of file) that are deliberately not fetched.
ignore = [
  "/government/statistics/data-quality-and-methodology-tsm-2024",
  "/guidance/pre-release-access-list-tsm-2024",
  "/government/collections/regulatory-judgements-a-to-z-list-of-landlords",
  "/government/collections/regulatory-judgements-and-enforcement-notices",
  "/government/publications/list-of-non-submission-of-annual-accounts",
]

# Tenant Satisfaction Measures -----------------------------------------------------------------------------------

[[file]]
source = "tsm"
role = "full-data"
period = "2024/25"
publisher = "Regulator of Social Housing"
licence = "Open Government Licence v3.0"
govuk = "/government/statistics/tenant-satisfaction-measures-202425"
match = "full data set"
types = ["xlsx", "zip"]

[[file]]
