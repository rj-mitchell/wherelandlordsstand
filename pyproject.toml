[project]
name = "landlords"
version = "0.1.0"
description = "Where Landlords Stand: how England's larger social landlords compare, from published regulator and Ombudsman data."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lxml>=5.3",
    "pyarrow>=17",
    "python-calamine>=0.3",
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "uvicorn>=0.30",
    # The Where They Stand sites' shared package (settings, the state database, the limit on posts, reports and the
    # right of reply, backups and their commands), as the wheel of a tagged release: the Docker image has no git
    # (wts-core docs/adr/0006). This site has no AI, so it never takes the "ai" extra (docs/DECISIONS.md, 6;
    # tests/test_dependencies.py). "cli" is Typer, for the shared commands; "offsite" is httpx, for the copies of
    # the backup sent to Backblaze B2. To take a newer release, change the version in both places and run `uv lock`.
    "wts-core[cli,offsite] @ https://github.com/rj-mitchell/wts-core/releases/download/v0.1.0/wts_core-0.1.0-py3-none-any.whl",
]

[project.scripts]
landlords = "landlords.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/landlords"]

[tool.hatch.metadata]
# wts-core is named by the address of its wheel, which hatchling refuses without this
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
